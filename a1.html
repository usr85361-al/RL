    <h1><b>І де я знаходжусь?</b></h1>
    <p>І де засідання депутатів. Вони обговорюють, якусь поточнну проблему. І ніяк не можуть дійти згоди. Тут із останнього ряду чується голос <br> -Ідея! <br> - Яка ідея? <br> -Ідея! <br> - Яка, яка у вас ідея? <br> -Ідея!<br> - Та кажіть уже! <br> - І де я знаходжусь?!</p>
